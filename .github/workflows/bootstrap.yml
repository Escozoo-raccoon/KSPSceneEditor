name: Bootstrap KSP Scene Editor v1.0.0

on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild repository payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/part_00 \
            .bootstrap/merged_01 \
            .bootstrap/merged_02 \
            .bootstrap/merged_03 \
            .bootstrap/m04_00 \
            .bootstrap/m04_01 \
            .bootstrap/m04_02 \
            .bootstrap/m04_03 \
            .bootstrap/m04_04 \
            .bootstrap/m04_05 \
            .bootstrap/m05_00 \
            .bootstrap/m05_01 \
            .bootstrap/m05_02 \
            .bootstrap/m05_03 > payload.b64
          base64 --decode payload.b64 > repo.zip
          rm -rf extracted
          mkdir extracted
          unzip -q repo.zip -d extracted
          cp -a extracted/. ./
          rm -rf .bootstrap payload.b64 repo.zip extracted
          rm -f .github/workflows/bootstrap.yml

      - name: Commit public v1.0.0 repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Publish KSP Scene Editor v1.0.0'
          git push origin HEAD:main
